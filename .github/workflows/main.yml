name: Kittygram CI/CD

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          POSTGRES_DB: kittygram
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.1.1
          pip install -r backend/requirements.txt

      - name: Check PEP8 and run backend tests
        env:
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: kittygram_password
          POSTGRES_DB: kittygram
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECRET_KEY: ci-secret-key
          DEBUG: "True"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          python -m flake8 backend/
          cd backend
          python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci
          npm test

  push_images:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_frontend:latest

      - name: Build and push gateway
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kittygram_gateway:latest

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: push_images
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.production.yml
          target: /home/ubuntu/kittygram
          overwrite: true

      - name: Update containers, migrate and collect static
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            cd /home/ubuntu/kittygram
            if [ ! -f docker-compose.production.yml ]; then
              found=$(find /home/ubuntu/kittygram -name docker-compose.production.yml -print -quit || true)
              if [ -n "${found}" ]; then
                cp "${found}" /home/ubuntu/kittygram/docker-compose.production.yml
              fi
            fi
            test -f docker-compose.production.yml
            if docker info >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif sudo -n docker info >/dev/null 2>&1; then
              COMPOSE="sudo docker compose"
            else
              echo "Docker недоступен: проверь права пользователя"
              exit 1
            fi
            $COMPOSE -f docker-compose.production.yml pull
            $COMPOSE -f docker-compose.production.yml up -d
            $COMPOSE -f docker-compose.production.yml run --rm frontend
            migrated=0
            for _ in $(seq 1 30); do
              if $COMPOSE -f docker-compose.production.yml exec -T backend python manage.py migrate --noinput; then
                migrated=1
                break
              fi
              sleep 2
            done
            test "$migrated" = 1
            $COMPOSE -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
            $COMPOSE -f docker-compose.production.yml exec -T backend sh -c "mkdir -p /backend_static/kittygram/static && cp -r /app/collected_static/. /backend_static/kittygram/static/"

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Деплой Kittygram успешно выполнен."
